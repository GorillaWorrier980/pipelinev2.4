name: Predeploy Gates

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  predeploy:
    name: predeploy / ragas+art
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docker/ragas/requirements.txt -r docker/art/requirements.txt

      - name: Run ART gate
        run: python docker/art/run_art.py

      - name: Run RAGAS gate
        run: python docker/ragas/run_ragas.py

      - name: Upload gate reports
        uses: actions/upload-artifact@v4
        with:
          name: predeploy-gates-reports
          path: reports/**
