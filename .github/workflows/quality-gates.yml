name: Quality Gates

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      scenario:
        description: Scenario to run
        type: choice
        required: false
        default: baseline
        options:
          - baseline
          - data_quality_degradation
          - pii_injection
          - explainability_shift
          - robustness_drop
      run_mode:
        description: Run mode for the pipeline config
        type: choice
        required: false
        default: full
        options:
          - full
          - premerge
          - nightly
          - release
          - custom
      gates:
        description: Optional comma-separated gate list override
        type: string
        required: false
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  premerge:
    name: gates / premerge
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Record workflow start
        run: echo "WORKFLOW_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r docker/ge/requirements.txt \
            -r docker/presidio/requirements.txt \
            -r docker/shap/requirements.txt \
            -r docker/art/requirements.txt \
            -r docker/ragas/requirements.txt

      - name: Prepare premerge config
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          config_path = Path("configs/pipeline.config.yaml")
          payload = json.loads(config_path.read_text())
          payload["run_mode"] = "premerge"
          Path("premerge.config.json").write_text(json.dumps(payload, indent=2))
          PY

      - name: Run premerge gates
        run: python scripts/run_pipeline.py --config premerge.config.json --gates "data_quality,pii_scan"

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: quality-gates-reports
          path: |
            REPORT_SUMMARY.json
            reports/**
            runs/**/artifacts/**

      - name: Publish job summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path

          summary_path = Path("REPORT_SUMMARY.json")
          if not summary_path.exists():
            Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("Pipeline did not produce REPORT_SUMMARY.json\n")
            raise SystemExit(0)

          summary = json.loads(summary_path.read_text())
          statuses = summary.get("gate_statuses", [])
          durations = summary.get("durations_seconds", {})
          total_duration = summary.get("total_duration_seconds")

          lines = ["# Quality gate summary", ""]
          lines.append("| Gate | Status | Details | Duration (s) |")
          lines.append("| --- | --- | --- | --- |")
          for status in statuses:
            badge = "✅" if status.get("passed") else "❌"
            details = status.get("details", "")
            duration = durations.get(status.get("id"))
            duration_cell = f"{duration:.2f}" if duration is not None else "—"
            lines.append(f"| {status.get('label', status.get('id', ''))} | {badge} | {details} | {duration_cell} |")
          agg_duration = durations.get("aggregator")
          if agg_duration is not None:
            lines.append(f"| Aggregator | — | Consolidated gate outputs | {agg_duration:.2f} |")
          if total_duration is not None:
            lines.append("| **Pipeline total** |  |  | **{:.2f}** |".format(total_duration))
          workflow_started_raw = os.environ.get("WORKFLOW_STARTED_AT")
          workflow_started = int(workflow_started_raw) if workflow_started_raw else None
          if workflow_started:
            workflow_elapsed = time.time() - workflow_started
            lines.append("| **Workflow wall-clock** |  |  | **{:.2f}** |".format(workflow_elapsed))
            if total_duration is not None:
              overhead = workflow_elapsed - total_duration
              lines.append("| Setup & overhead |  | Includes checkout, deps, artifact upload | {:.2f} |".format(overhead))
          lines.append("")

          diagram = ["```mermaid", "flowchart LR", "  trigger([GitHub Push/PR]):::neutral --> gates([Quality Gates]):::neutral", "  gates --> agg{{Aggregate}}:::neutral"]
          for status in statuses:
            node_id = status.get("id", "gate")
            label = status.get("label", node_id)
            badge = "✅" if status.get("passed") else "❌"
            diagram.append(f"  agg --> {node_id}([{label} {badge}])")
          diagram.append("  agg --> artifacts[[Reports & Dashboard]]")
          diagram.append("  classDef pass fill:#d1fae5,stroke:#34d399,color:#065f46;")
          diagram.append("  classDef fail fill:#fee2e2,stroke:#f87171,color:#991b1b;")
          diagram.append("  classDef neutral fill:#e2e8f0,stroke:#94a3b8,color:#0f172a;")
          for status in statuses:
            node_id = status.get("id", "gate")
            diagram.append(f"  class {node_id} {'pass' if status.get('passed') else 'fail'}")
          diagram.append("  class trigger,gates,agg,artifacts neutral")
          diagram.append("```")

          lines.extend(diagram)
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(lines))
          PY

  dispatch:
    name: gates / scenario-dispatch
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Record workflow start
        run: echo "WORKFLOW_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r docker/ge/requirements.txt \
            -r docker/presidio/requirements.txt \
            -r docker/shap/requirements.txt \
            -r docker/art/requirements.txt \
            -r docker/ragas/requirements.txt

      - name: Prepare dispatch config
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          config_path = Path("configs/pipeline.config.yaml")
          payload = json.loads(config_path.read_text())
          payload["run_mode"] = "${{ github.event.inputs.run_mode }}"
          Path("dispatch.config.json").write_text(json.dumps(payload, indent=2))
          PY

      - name: Run scenario
        run: |
          if [ -n "${{ github.event.inputs.gates }}" ]; then
            python scripts/run_scenario.py \
              --scenario "${{ github.event.inputs.scenario }}" \
              --config dispatch.config.json \
              --gates "${{ github.event.inputs.gates }}"
          else
            python scripts/run_scenario.py \
              --scenario "${{ github.event.inputs.scenario }}" \
              --config dispatch.config.json
          fi

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: quality-gates-reports
          path: |
            REPORT_SUMMARY.json
            reports/**
            runs/**/artifacts/**

  nightly:
    name: gates / nightly-scenarios
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        scenario: [baseline, pii_injection, data_quality_degradation]
    steps:
      - name: Record workflow start
        run: echo "WORKFLOW_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r docker/ge/requirements.txt \
            -r docker/presidio/requirements.txt \
            -r docker/shap/requirements.txt \
            -r docker/art/requirements.txt \
            -r docker/ragas/requirements.txt

      - name: Prepare nightly config
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          config_path = Path("configs/pipeline.config.yaml")
          payload = json.loads(config_path.read_text())
          payload["run_mode"] = "nightly"
          Path("nightly.config.json").write_text(json.dumps(payload, indent=2))
          PY

      - name: Run scenario
        run: |
          python scripts/run_scenario.py \
            --scenario "${{ matrix.scenario }}" \
            --config nightly.config.json

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: quality-gates-reports-${{ matrix.scenario }}
          path: |
            REPORT_SUMMARY.json
            reports/**
            runs/**/artifacts/**
