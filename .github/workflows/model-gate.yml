name: Model Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model:
    name: model / shap
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docker/shap/requirements.txt

      - name: Run SHAP gate
        run: python docker/shap/run_shap.py

      - name: Upload gate reports
        uses: actions/upload-artifact@v4
        with:
          name: model-gate-reports
          path: reports/**
