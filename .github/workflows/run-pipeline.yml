name: Run Quality Gates Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute quality gates pipeline
        run: python run_pipeline.py

      - name: Summarize gate results in job summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary_path = Path("REPORT_SUMMARY.json")
          if not summary_path.exists():
              print("REPORT_SUMMARY.json not found; skipping job summary update.")
              raise SystemExit(0)

          data = json.loads(summary_path.read_text())
          gates = data.get("gate_statuses", [])
          generated = data.get("generated_at", "(unknown time)")
          dashboard_path = data.get("dashboard", {}).get("path", "reports/dashboard/index.html")

          lines = [
              "## Quality Gates Results",
              f"Generated at `{generated}`",
              "",
              "| Gate | Status | Details |",
              "| --- | --- | --- |",
          ]

          if not gates:
              lines.append("| (no gates found) | | |")
          else:
              for gate in gates:
                  badge = "✅" if gate.get("passed") else "❌"
                  label = gate.get("label", gate.get("id", "(unknown)"))
                  details = gate.get("details", "")
                  lines.append(f"| {label} | {badge} | {details} |")

          lines += [
              "",
              f"Dashboard: `{dashboard_path}` (uploaded as artifact below)",
              "",
              "### DevOps Flow (live run)",
          ]

          # Build a simple Mermaid flow diagram with dynamic gate statuses so the run's
          # execution path is visible directly in the GitHub Actions summary.
          diagram = [
              "```mermaid",
              "flowchart TD",
              "  trigger([GitHub Push/PR]) --> job[Run pipeline]",
          ]

          for idx, gate in enumerate(gates):
              node = f"gate{idx}"
              label = gate.get("label", gate.get("id", f"Gate {idx+1}"))
              badge = "✅" if gate.get("passed") else "❌"
              diagram.append(f"  job --> {node}[{label} {badge}]")

          agg_badge = "✅" if all(g.get("passed") for g in gates) else "⚠️"
          diagram += [
              f"  job --> aggregator[Aggregator {agg_badge}]",
              "  aggregator --> artifacts[[Reports & Dashboard]]",
          ]

          for idx, _ in enumerate(gates):
              diagram.append(f"  gate{idx} --> aggregator")

          diagram.append("```")
          lines.extend(diagram)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("\n".join(lines) + "\n")

          print("Wrote gate results to GitHub job summary.")
          PY

      - name: Upload aggregated reports
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-summary
          path: |
            REPORT_SUMMARY.json
            reports/dashboard/index.html
          if-no-files-found: error
