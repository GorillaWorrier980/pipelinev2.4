name: Run Quality Gates Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  data_gates:
    name: data / GE + Presidio
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Great Expectations and Presidio
        run: |
          python docker/ge/run_expectations.py
          python docker/presidio/run_presidio.py

      - name: Upload data gate reports
        uses: actions/upload-artifact@v4
        with:
          name: data-gates
          path: |
            reports/ge/summary.json
            reports/presidio/redaction_summary.json
          if-no-files-found: error

  model_shap:
    name: model / SHAP
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run SHAP gate
        run: python docker/shap/run_shap.py

      - name: Upload SHAP report
        uses: actions/upload-artifact@v4
        with:
          name: shap-gate
          path: reports/shap/global.json
          if-no-files-found: error

  predeploy_gates:
    name: predeploy / RAGAS + ART
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run RAGAS and ART gates
        run: |
          python docker/ragas/run_ragas.py
          python docker/art/run_art.py

      - name: Upload predeploy reports
        uses: actions/upload-artifact@v4
        with:
          name: predeploy-gates
          path: |
            reports/ragas/summary.json
            reports/art/robustness.json
          if-no-files-found: error

  aggregate:
    name: aggregate / consolidate results
    runs-on: ubuntu-latest
    needs: [data_gates, model_shap, predeploy_gates]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download gate artifacts
        uses: actions/download-artifact@v4
        with:
          name: data-gates
          path: .
          merge-multiple: true

      - name: Download SHAP artifact
        uses: actions/download-artifact@v4
        with:
          name: shap-gate
          path: .
          merge-multiple: true

      - name: Download predeploy artifacts
        uses: actions/download-artifact@v4
        with:
          name: predeploy-gates
          path: .
          merge-multiple: true

      - name: Normalize gate report locations
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          targets = {
              "ge": Path("reports/ge/summary.json"),
              "presidio": Path("reports/presidio/redaction_summary.json"),
              "shap": Path("reports/shap/global.json"),
              "art": Path("reports/art/robustness.json"),
              "ragas": Path("reports/ragas/summary.json"),
          }

          for name, dest in targets.items():
              dest.parent.mkdir(parents=True, exist_ok=True)
              if dest.exists():
                  print(f"{name}: found at {dest}")
                  continue

              candidates = list(Path(".").rglob(dest.name))
              if not candidates:
                  print(f"{name}: missing (no candidates for {dest.name})")
                  continue

              source = candidates[0]
              shutil.copy2(source, dest)
              print(f"{name}: copied {source} -> {dest}")
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run aggregator
        run: python docker/aggregator/run_aggregator.py

      - name: Summarize gate results in job summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary_path = Path("REPORT_SUMMARY.json")
          if not summary_path.exists():
              print("REPORT_SUMMARY.json not found; skipping job summary update.")
              raise SystemExit(0)

          data = json.loads(summary_path.read_text())
          gates = data.get("gate_statuses", [])
          generated = data.get("generated_at", "(unknown time)")
          dashboard_path = data.get("dashboard", {}).get("path", "reports/dashboard/index.html")

          lines = [
              "## Quality Gates Results",
              f"Generated at `{generated}`",
              "",
              "| Gate | Status | Details |",
              "| --- | --- | --- |",
          ]

          if not gates:
              lines.append("| (no gates found) | | |")
          else:
              for gate in gates:
                  badge = "✅" if gate.get("passed") else "❌"
                  label = gate.get("label", gate.get("id", "(unknown)"))
                  details = gate.get("details", "")
                  lines.append(f"| {label} | {badge} | {details} |")

          lines += [
              "",
              f"Dashboard path: `{dashboard_path}`",
              "", 
              "**Download artifacts**:",
              "- `pipeline-summary` (REPORT_SUMMARY.json, dashboard HTML, gate status JSON)",
              "- `data-gates`, `shap-gate`, `predeploy-gates` (raw gate reports)",
              "",
              "### DevOps Flow (live run)",
          ]

          diagram = [
              "```mermaid",
              "flowchart LR",
              "  classDef pass fill:#d1fae5,stroke:#34d399,color:#065f46;",
              "  classDef fail fill:#fee2e2,stroke:#f87171,color:#991b1b;",
              "  classDef neutral fill:#e2e8f0,stroke:#94a3b8,color:#0f172a;",
              "  trigger([GitHub Push/PR]):::neutral --> prep([Checkout & Setup]):::neutral",
              "  prep --> data([Data Gates]):::neutral",
              "  prep --> model([Model Gate]):::neutral",
              "  prep --> predeploy([Predeploy Gates]):::neutral",
              "  data --> agg{{Aggregate}}:::neutral",
              "  model --> agg",
              "  predeploy --> agg",
              "  agg --> artifacts[[Reports & Dashboard]]",
          ]

          agg_pass = all(g.get("passed") for g in gates) if gates else False
          agg_badge = "✅" if agg_pass else "❌"

          for gate in gates:
              label = gate.get("label", gate.get("id", "gate"))
              badge = "✅" if gate.get("passed") else "❌"
              diagram.append(f"  agg --> {label.replace(' ', '_')}[{label} {badge}]")

          diagram.append(f"  class agg {'pass' if agg_pass else 'fail'}")
          diagram.append("  class trigger,prep,data,model,predeploy,artifacts neutral")
          diagram.append("```")
          lines.extend(diagram)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("\n".join(lines) + "\n")

          print("Wrote gate results to GitHub job summary.")
          PY

      - name: Upload aggregated reports
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-summary
          path: |
            REPORT_SUMMARY.json
            reports/dashboard/index.html
          if-no-files-found: error
