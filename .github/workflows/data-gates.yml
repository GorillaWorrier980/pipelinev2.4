name: Data Gates

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data:
    name: data / great-expectations+presidio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docker/ge/requirements.txt -r docker/presidio/requirements.txt

      - name: Run Great Expectations
        run: python docker/ge/run_expectations.py

      - name: Run Presidio
        run: python docker/presidio/run_presidio.py

      - name: Upload gate reports
        uses: actions/upload-artifact@v4
        with:
          name: data-gates-reports
          path: reports/**
